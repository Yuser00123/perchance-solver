version: '3.8'

services:
  solver:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8191:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/cron"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Byparr generic solver (drop-in FlareSolverr replacement, Camoufox 200MB)
  # Use this if you want generic FlareSolverr API without custom Perchance logic
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    ports:
      - "8192:8191"
    environment:
      - LOG_LEVEL=INFO
      - PORT=8191
    restart: unless-stopped
    mem_limit: 512m
